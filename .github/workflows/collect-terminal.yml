name: Collect Terminal

on:
  workflow_dispatch:

concurrency:
  group: collect-terminal
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          DIRECT_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
      - name: Generate terminal Prisma client
        run: npx prisma generate --schema prisma-terminal/schema.prisma
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          DIRECT_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          TERMINAL_DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
      - run: npx tsx scripts/terminal/collect-coingecko.ts
        env:
          TERMINAL_DATABASE_URL: ${{ secrets.TERMINAL_DATABASE_URL }}
          COINGECKO_DEMO_API_KEY: ${{ secrets.COINGECKO_DEMO_API_KEY }}
      - run: npx tsx scripts/terminal/collect-defillama.ts
        if: always()
        env:
          TERMINAL_DATABASE_URL: ${{ secrets.TERMINAL_DATABASE_URL }}
      - run: npm run collect:hyperliquid
        if: always()
        continue-on-error: true
        env:
          TERMINAL_DATABASE_URL: ${{ secrets.TERMINAL_DATABASE_URL }}
      - name: Collect Coinalyze hourly
        run: npm run collect:coinalyze-hourly
        env:
          TERMINAL_DATABASE_URL: ${{ secrets.TERMINAL_DATABASE_URL }}
          COINALYZE_API_KEY: ${{ secrets.COINALYZE_API_KEY }}
      - name: Publish overview snapshot
        run: npm run publish:snapshots -- --screen overview
        timeout-minutes: 2
        if: ${{ !cancelled() }}
        env:
          DASHBOARD_DATABASE_URL: ${{ secrets.DASHBOARD_DATABASE_URL }}
          FORUM_SNAPSHOT_DATABASE_URL: ${{ secrets.FORUM_SNAPSHOT_DATABASE_URL }}
          TERMINAL_ALLOW_REMOTE: "1"
