name: Probe Leverage Macro

on:
  workflow_dispatch:

permissions: {}

jobs:
  probe-leverage-macro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx tsx scripts/terminal/probe-leverage-macro-status.ts
